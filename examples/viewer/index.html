<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>The library and the viewer</title>

<!--
  The other way in: paginate under your own control, then show the result.

  Use this when the pages are *part* of an application — a preview pane, an
  editor, a reader — rather than the whole of it. The engine hands back page
  elements and their records; the viewer turns those into something to look at.
-->
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #f4f4f6; color: #222 }
  #bar {
    position: sticky; inset-block-start: 0; z-index: 2;
    display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
    padding: 0.6rem 1rem; background: #fff; border-block-end: 1px solid #0002;
  }
  button, select { font: inherit; padding: 0.25rem 0.6rem }
  #where { font-variant-numeric: tabular-nums; margin-inline-start: auto; color: #555 }
  #source { display: none }   /* the flow, not the pages: the viewer shows the pages */
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e6e6e6 }
    #bar { background: #1c1f25; border-color: #fff2 }
    #where { color: #9aa0a6 }
  }

  /* The document's own print CSS. The engine reads it; the application does
     not have to restate any of it in JavaScript.

     Note what these selectors do *not* do: they never reach through `#source`.
     A page is composed from the flow's *children*, so the element you hand to
     `paginate` is not an ancestor of anything on a page — `#source p` matches
     in the document and nothing at all on a page. Style the content, not its
     container. (Paginating `document.body`, as the drop-in example does, hides
     this: a bare `p` selector has no container to reach through.) */
  @page {
    size: 120mm 170mm;
    margin: 14mm 13mm 16mm;
    @bottom-center { content: counter(page) " / " counter(pages); font: 8pt/1 Georgia, serif; color: #666 }
    /* A running head is one line. Say so, or a long title wraps and the
       margin box clips it — css-page-3 gives margin boxes no room to grow. */
    @top-right {
      content: string(chapter);
      font: italic 8pt/1.2 Georgia, serif; color: #666;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  }
  .chapter, .para { font-family: Georgia, "Times New Roman", serif }
  .chapter {
    font-size: 12pt; line-height: 1.3; margin: 1.4rem 0 0.5rem;
    /* `content()` is the heading's *text*. `content(element)` would carry the
       heading itself — which is what a chapter title containing a formula
       needs, and which brings the heading's own font size into a margin box
       built for 8pt. Use the element form only when you mean it. */
    string-set: chapter content();
    break-after: avoid;                     /* never last on a page */
  }
  .chapter:first-child { margin-block-start: 0 }
  .para {
    font-size: 10pt; line-height: 1.5; margin: 0 0 0.6rem;
    text-align: justify; hyphens: auto; orphans: 2; widows: 2;
  }
</style>

<div id="bar">
  <button id="prev">◀ Previous</button>
  <button id="next">Next ▶</button>
  <label>Go to <input id="goto" type="number" min="1" value="1" style="inline-size:5rem"></label>
  <label><input id="spreads" type="checkbox"> Spreads</label>
  <label>Zoom
    <select id="zoom">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.5">150%</option>
    </select>
  </label>
  <span id="where">paginating…</span>
</div>

<article id="source"></article>
<div id="pages"></div>

<script type="module">
  // Two modules: the engine, and the viewer that shows what it produced. The
  // viewer never measures anything — it consumes pages and records.
  import * as folio from "/dist/folio.mjs";
  import { renderViewer } from "/dist/folio-viewer.mjs";

  // A book's worth of text, generated so the example stays a file rather than
  // a download. Any real document goes here instead.
  const WORDS = ("aurora borealis streamer corona zenith magnetic declination " +
    "spectrum prism eyepiece meridian latitude observation instrument reading " +
    "twilight horizon cloudless interval").split(" ");
  const words = (seed, n) =>
    Array.from({ length: n }, (_, i) => WORDS[(seed * 13 + i * 7) % WORDS.length]).join(" ");
  const source = document.getElementById("source");
  source.innerHTML = Array.from({ length: 24 }, (_, c) =>
    `<h2 class="chapter">Chapter ${c + 1}. ${words(c, 3)}</h2>` +
    Array.from({ length: 5 }, (_, p) => {
      const s = c * 7 + p;
      return `<p class="para">${words(s, 60).replace(/^./, (x) => x.toUpperCase())}.</p>`;
    }).join(""),
  ).join("");

  // ---- Stages 1 to 5 -------------------------------------------------------
  // 1. Read the document: wait for fonts, collect the CSS, pull out `@page`.
  const doc = await folio.normalize(document);

  // 2. Pages are measured somewhere that is not the application's own layout.
  const frame = folio.createEngineFrame(document);
  const target = frame.contentDocument;
  const style = target.createElement("style");
  style.textContent = `body{margin:0}\n${doc.authorCss}`;
  target.head.append(style);
  await target.fonts.ready;

  // 3-5. Fragment, compose, resolve references. One call, and it is the only
  // one that does any work.
  const result = folio.paginate({
    source,
    pageRules: doc.pageRules,
    target,
    references: doc.references,
    maxPages: 400,
  });

  // ---- Show it -------------------------------------------------------------
  const where = document.getElementById("where");
  const view = renderViewer({
    host: document.getElementById("pages"),
    sheets: result.sheets,     // the pages, as the engine built them
    records: result.records,   // (spec, start, end) — which side each page is
    zoom: 1,
    onPage: (n) => {
      where.textContent = `page ${n} of ${view.total}`;
      document.getElementById("goto").value = String(n);
    },
  });
  where.textContent = `page 1 of ${view.total}`;
  if (result.overflowed.length > 0) {
    // Reported, never hidden: a page that does not fit is a bug upstream.
    console.warn("pages that overflowed:", result.overflowed);
  }

  document.getElementById("prev").onclick = () => view.previous();
  document.getElementById("next").onclick = () => view.next();
  document.getElementById("goto").onchange = (e) => view.goTo(Number(e.target.value));
  document.getElementById("spreads").onchange = (e) => view.setSpreads(e.target.checked);
  document.getElementById("zoom").onchange = (e) => view.setZoom(Number(e.target.value));
</script>
</html>
