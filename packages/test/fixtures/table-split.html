<!doctype html>
<meta charset="utf-8">
<title>table splitting fixture</title>
<style>
  @page { size: 400px 220px; margin: 20px }
  body { margin: 0; font: 14px/18px serif }
  table { border-collapse: collapse; inline-size: 100% }
  th, td { border: 1px solid #999; padding: 2px 4px; text-align: start }
  thead th { background: #eee }
  tfoot td { font-style: italic }
</style>
<body>
<article id="src"><table id="t"><thead><tr><th>Element</th><th>Symbol</th></tr></thead><tfoot><tr><td colspan="2">Source: the periodic table</td></tr></tfoot><tbody>
<tr><td>Hydrogen</td><td>H</td></tr><tr><td>Helium</td><td>He</td></tr><tr><td>Lithium</td><td>Li</td></tr>
<tr><td>Beryllium</td><td>Be</td></tr><tr><td>Boron</td><td>B</td></tr><tr><td>Carbon</td><td>C</td></tr>
<tr><td>Nitrogen</td><td>N</td></tr><tr><td>Oxygen</td><td>O</td></tr><tr><td>Fluorine</td><td>F</td></tr>
<tr><td>Neon</td><td>Ne</td></tr><tr><td>Sodium</td><td>Na</td></tr><tr><td>Magnesium</td><td>Mg</td></tr>
<tr><td>Aluminium</td><td>Al</td></tr><tr><td>Silicon</td><td>Si</td></tr><tr><td>Phosphorus</td><td>P</td></tr>
</tbody></table></article>
</body>
