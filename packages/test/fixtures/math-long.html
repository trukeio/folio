<!doctype html>
<meta charset="utf-8">
<title>math-heavy book</title>
<!--
  The M4 exit fixture: a math-heavy document long enough to be a book rather
  than a test case. Fifty sections, generated so the file stays readable and
  the content stays deterministic — the same document on every run and every
  engine, which is what makes "the snapshot is stable" mean anything.
-->
<style>
  @font-face {
    font-family: "STIX Two Math";
    src: url("./fonts/STIXTwoMath-Regular.otf") format("opentype");
  }
  @page {
    size: 400px 600px;
    margin: 20px;
    @top-center { content: string(sectiontitle) }
    @bottom-center { content: counter(page) }
  }
  body { margin: 0; font: 16px/20px serif }
  p { margin: 0 0 12px }
  h2 { font-size: 16px; margin: 0 0 8px; string-set: sectiontitle content(element) }
  math { font-family: "STIX Two Math" }
  math.numbered { math-number: yes }
  a.eqref::after { content: " (" target-counter(attr(href), equation) ")" }
</style>
<body>
<article id="src"></article>
<script>
const WORDS = "alpha bravo charlie delta echo foxtrot golf hotel india juliet kilo lima mike november oscar papa quebec romeo sierra tango uniform victor whiskey xray yankee zulu".split(" ");
const paragraph = (seed, length) => {
  const out = [];
  for (let i = 0; i < length; i++) out.push(WORDS[(seed * 7 + i * 3) % WORDS.length]);
  return out.join(" ") + ".";
};

/** A short equation that fits the measure. */
const short = (n) =>
  `<mrow><msub><mi>x</mi><mn>${n}</mn></msub><mo>+</mo><mi>y</mi><mo>=</mo>` +
  `<mfrac><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow><mn>${n + 1}</mn></mfrac></mrow>`;

/** One too wide for the measure, which has to break. */
const wide = (n) =>
  `<mrow><munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover>` +
  `<msub><mi>a</mi><mi>i</mi></msub><mo>+</mo><msub><mi>b</mi><mi>i</mi></msub>` +
  `<mo>+</mo><msub><mi>c</mi><mi>i</mi></msub><mo>=</mo>` +
  `<msqrt><mrow><mi>x</mi><mo>+</mo><mn>${n}</mn></mrow></msqrt>` +
  `<mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi><mo>+</mo><mi>w</mi><mo>+</mo><mi>u</mi>` +
  `<mo>+</mo><mi>v</mi><mo>+</mo><mi>p</mi><mo>+</mo><mi>q</mi><mo>+</mo><mi>r</mi></mrow>`;

/** Wider still: three rows' worth, and no relation to align on. */
const widest = (n) => {
  const terms = [];
  for (let i = 0; i < 18; i++) {
    terms.push(`<msup><mi>${"abcdefgh"[i % 8]}</mi><mn>${(i % 3) + 2}</mn></msup>`);
    if (i < 17) terms.push("<mo>+</mo>");
  }
  return `<mrow>${terms.join("")}</mrow>`;
};

/** A fenced group, which is one unit however wide it is. */
const fenced = (n) =>
  `<mrow><mi>f</mi><mo>(</mo><mrow><mi>x</mi><mo>+</mo><mi>y</mi><mo>+</mo><mi>z</mi></mrow><mo>)</mo>` +
  `<mo>=</mo><mi>g</mi><mo>(</mo><mrow><mi>u</mi><mo>+</mo><mi>v</mi></mrow><mo>)</mo>` +
  `<mo>+</mo><mi>h</mi><mo>(</mo><mrow><mi>s</mi><mo>+</mo><mi>t</mi></mrow><mo>)</mo></mrow>`;

const SHAPES = [short, wide, short, widest, short, fenced];
const article = document.getElementById("src");
const parts = [];
for (let n = 0; n < 50; n++) {
  parts.push(`<h2 id="s${n}">Section ${n + 1} <msqrt-placeholder></msqrt-placeholder></h2>`);
  parts.push(`<p>${paragraph(n, 58)}</p>`);
  parts.push(`<p>${paragraph(n + 1, 52)} See <a class="eqref" href="#eq${n}">the equation</a>.</p>`);
  const shape = SHAPES[n % SHAPES.length];
  parts.push(`<math class="numbered" id="eq${n}" display="block">${shape(n)}</math>`);
  parts.push(`<p>${paragraph(n + 2, 46)}</p>`);
}
article.innerHTML = parts.join("\n").replaceAll(
  "<msqrt-placeholder></msqrt-placeholder>",
  '<math display="inline"><msqrt><mi>x</mi></msqrt></math>',
);
</script>
</body>
